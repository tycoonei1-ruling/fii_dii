name: Daily FII DII Update

on:

  schedule:
    # 6 PM IST = 12:30 UTC
    - cron: '30 12 * * 1-5'

  workflow_dispatch:

jobs:

  run:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Requirements
        run: |
          pip install -r requirements.txt

      - name: Run Script
        run: |
          python daily_fii_dii_update.py
