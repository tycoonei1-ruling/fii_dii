name: Daily FII DII Update

on:
  schedule:
    - cron: '30 12 * * 1-5'

  workflow_dispatch:

jobs:

  run:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - run: python daily_fii_dii_update.py